<!doctype html>

<style>
@font-face{font-family:T;src:url(../fonts/InterTight-ExtraBold.ttf)}

.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;will-change:transform,clip-path}

<body><div id="stage"></div>

<script>
const W=1080,H=1920,stage=document.getElementById('stage');
const P=TL.phrases;
const w=(p,k)=>P[p-1].mots[k][1];             /* début du k-ième mot de la phrase p */
const deb=p=>P[p-1].debut, fin=p=>P[p-1].fin;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-11*x),in:x=>x*x*x,
 inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 elas:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const SONS=[]; const son=(t,k,x=0)=>SONS.push([+t.toFixed(3),k,x]);
const els=[];
function mk(par,html,cls='',style='',def={}){const d=document.createElement('div');d.className='abs '+cls;d.style.cssText=style;d.innerHTML=html;(par.el||par).appendChild(d);
 const o={el:d,anims:[],def:Object.assign({x:0,y:0,s:1,r:0,o:1,b:0,sx:1,cr:-1},def)};els.push(o);return o}
function A(o,t0,dur,props,ease='out'){o.anims.push({t0,dur,props,ease});return o}
/* apparition « pro » : montée + flou qui se dissipe */
function entre(o,t0,dy=70,d=.45){o.def.o=0;return A(o,t0,d,{o:[0,1],y:[dy,0],b:[14,0]},'out')}
function pop(o,t0,d=.42,s0=0){o.def.o=0;A(o,t0,.12,{o:[0,1]},'lin');return A(o,t0,d,{s:[s0,1]},'back')}
function sort(o,t0,d=.25,dy=-60){return A(o,t0,d,{o:[1,0],y:[0,dy],b:[0,10]},'in')}
function render(t){
 for(const o of els){
  const st={...o.def,x:0,y:0},set={};
  for(const a of o.anims)for(const k in a.props){
   const [f,to]=a.props[k];
   if(t>=a.t0){st[k]=f+(to-f)*E[a.ease](clamp((t-a.t0)/a.dur));set[k]=1}
   else if(!set[k]){st[k]=f;set[k]=1}
  }
  const e=o.el,op=clamp(st.o);
  if(o.fen){const vis=t>=o.fen[0]&&t<o.fen[1];e.style.display=vis?'block':'none';if(!vis)continue}
  e.style.opacity=op;e.style.visibility=op<=.002?'hidden':'visible';
  e.style.transform=`translate3d(${o.def.x+st.x}px,${o.def.y+st.y}px,0) rotate(${st.r}deg) scale(${st.s*st.sx},${st.s})`;
  e.style.filter=st.b>.2?`blur(${st.b.toFixed(1)}px)`:'none';
  if(st.cr>=0)e.style.clipPath=`circle(${st.cr}px at ${o.cx||540}px ${o.cy||960}px)`;
  if(o.tick)o.tick(t,e,st);
 }
}
/* scène : fond + grille, visible sur [a,b] */
function scene(a,b,fond,grille='rgba(255,255,255,.07)',z=0){
 const s=mk(stage,`<div class="grille" style="--g:${grille}"></div>`,'sc',`background:${fond};z-index:${z}`);
 s.fen=[a,b];const g=s.el.firstChild;s.tick=(t)=>{g.style.transform=`translate(${(-(t*14)%72).toFixed(1)}px,${(-(t*9)%72).toFixed(1)}px)`};return s}
function img(par,src,x,y,s=1,cls='',style=''){const o=mk(par,`<img src="${src}">`,'crop '+cls,style);o.def.x=x;o.def.y=y;o.def.s=s;return o}
/* texte qui se tape */
function tape(o,txt,t0,t1,curseur=true){const n=o.el.querySelector('.tape');o.tick=(t)=>{const k=Math.round(clamp((t-t0)/(t1-t0))*txt.length);
 n.textContent=txt.slice(0,k);const c=o.el.querySelector('.car');if(c)c.style.opacity=(curseur&&(t<t1+.6?Math.floor(t*3)%2===0||t<t1:false))?1:0}}
/* compteur */
function compte(o,sel,v0,v1,t0,d,fmt=v=>Math.round(v)){const n=o.el.querySelector(sel);const old=o.tick;o.tick=(t,e,st)=>{old&&old(t,e,st);n.textContent=fmt(v0+(v1-v0)*E.out(clamp((t-t0)/d)))}}
/* curseur (main) */
const MAIN=`<svg width="92" height="92" viewBox="0 0 24 24"><path d="M9 2.5c.8 0 1.5.7 1.5 1.5v6.3l.9-.2c.9-.1 1.6.5 1.7 1.3l.1.6.8-.1c.9-.1 1.6.5 1.7 1.3l.1.5.6-.1c.9-.1 1.7.5 1.7 1.4v3.6c0 2.6-2.1 4.9-4.8 4.9h-2.6c-1.6 0-3-.8-3.9-2.1L3.4 15c-.5-.7-.3-1.6.4-2.1.6-.4 1.4-.3 1.9.2l1.8 1.9V4c0-.8.7-1.5 1.5-1.5z" fill="#fff" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
function curseur(par,pts,clics){ /* pts: [[t,x,y],...] ; clics: [t,...] */
 const o=mk(par,MAIN+'<div class="onde" style="position:absolute;left:-30px;top:-34px;width:80px;height:80px;border-radius:50%;border:5px solid #fff;opacity:0"></div>','', 'z-index:50;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))');
 o.def.o=0;A(o,pts[0][0]-.15,.2,{o:[0,1]},'lin');
 const X0=pts[0][1],Y0=pts[0][2];for(let i=1;i<pts.length;i++)A(o,pts[i-1][0],pts[i][0]-pts[i-1][0],{x:[pts[i-1][1]-X0,pts[i][1]-X0],y:[pts[i-1][2]-Y0,pts[i][2]-Y0]},'inOut');
 o.def.x=X0-35;o.def.y=Y0-10;
 for(const c of clics){A(o,c-.08,.08,{s:[1,.82]},'out');A(o,c,.18,{s:[.82,1]},'out');son(c,'clic')}
 const onde=o.el.querySelector('.onde');
 o.tick=(t)=>{let k=-1;for(const c of clics)if(t>=c&&t<c+.45)k=(t-c)/.45;onde.style.opacity=k<0?0:1-k;onde.style.transform=`scale(${k<0?0:.5+k*1.6})`};
 return o}
/* surligneur qui balaie */
function surl(par,x,y,wd,h,t0,r=0){const o=mk(par,'','surl',`width:${wd}px;height:${h}px`);o.def.x=x;o.def.y=y;o.def.r=r;o.def.sx=0;o.el.style.transformOrigin='0 50%';A(o,t0,.35,{sx:[0,1]},'out');return o}
const ANDROID=`<svg viewBox="0 0 24 24" width="86" height="86"><path fill="#fff" d="M18.4395 5.5586c-.675 1.1664-1.352 2.3318-2.0274 3.498-.0366-.0155-.0742-.0286-.1113-.043-1.8249-.6957-3.484-.8-4.42-.787-1.8551.0185-3.3544.4643-4.2597.8203-.084-.1494-1.7526-3.021-2.0215-3.4864a1.1451 1.1451 0 0 0-.1406-.1914c-.3312-.364-.9054-.4859-1.379-.203-.475.282-.7136.9361-.3886 1.5019 1.9466 3.3696-.0966-.2158 1.9473 3.3593.0172.031-.4946.2642-1.3926 1.0177C2.8987 12.176.452 14.772 0 18.9902h24c-.119-1.1108-.3686-2.099-.7461-3.0683-.7438-1.9118-1.8435-3.2928-2.7402-4.1836a12.1048 12.1048 0 0 0-2.1309-1.6875c.6594-1.122 1.312-2.2559 1.9649-3.3848.2077-.3615.1886-.7956-.0079-1.1191a1.1001 1.1001 0 0 0-.8515-.5332c-.5225-.0536-.9392.3128-1.0488.5449zm-.0391 8.461c.3944.5926.324 1.3306-.1563 1.6503-.4799.3197-1.188.0985-1.582-.4941-.3944-.5927-.324-1.3307.1563-1.6504.4727-.315 1.1812-.1086 1.582.4941zM7.207 13.5273c.4803.3197.5506 1.0577.1563 1.6504-.394.5926-1.1038.8138-1.584.4941-.48-.3197-.5503-1.0577-.1563-1.6504.4008-.6021 1.1087-.8106 1.584-.4941z"/></svg>`;
const CHECK=`<svg viewBox="0 0 24 24" width="52" height="52"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const KF='../assets/logos/kamforms.png', WA='../assets/logos/whatsapp.png', APK='../assets/logos/apkpure.png';

/* =============== 1. C'EST OFFICIEL (0 → fin phrase 1) =============== */
const T2=deb(2)-.12;
{const s=scene(0,T2+.5,'radial-gradient(120% 70% at 50% 40%,#123d27 0%,#0b0a0f 62%)','rgba(255,255,255,.045)',1);
 const cest=mk(s,'<div class="T c" style="font-size:96px;color:rgba(255,255,255,.75)">C’EST</div>','', '');cest.def.y=650;entre(cest,.1,50,.35);
 const off=mk(s,'<div class="T c" style="font-size:196px">OFFICIEL</div>');off.def.y=760;off.def.o=0;
 A(off,w(1,2)-.06,.1,{o:[0,1]},'lin');A(off,w(1,2)-.06,.38,{s:[1.6,1],b:[24,0]},'expo');son(w(1,2)-.04,'impact');
 const trait=mk(s,'','', 'width:640px;height:22px;border-radius:11px;background:var(--wa)');trait.def.x=220;trait.def.y=960;trait.def.sx=0;trait.el.style.transformOrigin='0 50%';A(trait,w(1,2)+.12,.4,{sx:[0,1]},'expo');
 /* KamForms */
 const tk=w(1,3)-.05;
 for(const o of [cest,off,trait])A(o,tk-.08,.3,{y:[0,-520],o:[1,0],b:[0,12]},'in');
 // le "y" relatif : on décale via un parent → plus simple : on anime y absolu
 const ic=img(s,KF,412,560,1,'', 'filter:drop-shadow(0 30px 60px rgba(37,211,102,.45))');ic.el.firstChild.style.cssText='width:256px;border-radius:56px';pop(ic,tk,.55);son(tk,'pop',700);
 A(ic,tk,2.4,{r:[-8,0]},'out');
 const nom=mk(s,'<div class="T c" style="font-size:150px">Kam<span style="color:var(--wa)">Forms</span></div>');nom.def.y=880;entre(nom,tk+.12,80,.4);
 const dispo=mk(s,'<div class="S c" style="font-size:100px;color:rgba(255,255,255,.85)">disponible sur</div>');dispo.def.y=1110;entre(dispo,w(1,5)-.05,50,.4);
 const andr=mk(s,`<div class="c"><span class="pill" style="background:#3DDC84;color:#062b16;font-size:104px;padding:26px 60px 26px 44px">${ANDROID.replace('#fff','#062b16')}Android</span></div>`);andr.def.y=1260;pop(andr,w(1,7)-.05,.5,.3);son(w(1,7)-.05,'pop',900);
 for(const o of [ic,nom,dispo,andr])A(o,T2-.05,.35,{s:[1,.9]},'in');
}
/* =============== 2. VÉRIFIÉE PAR APKPURE =============== */
const T3=deb(3)-.25;
{const s=scene(T2,T3+.6,'#eef3f0','rgba(0,0,0,.05)',2);
 s.cx=540;s.cy=1330;s.def.cr=0;A(s,T2,.55,{cr:[0,2300]},'inOut');son(T2-.05,'whoosh');
 const tit=mk(s,`<div class="c" style="display:flex;justify-content:center;align-items:center;gap:26px"><span class="S" style="font-size:96px;color:#0b0a0f">Vérifiée par</span><img src="${APK}" style="width:96px"><span class="T" style="font-size:90px;color:#0b0a0f">APK<span style="color:#24cd77">Pure</span></span></div>`);
 tit.def.y=150;entre(tit,T2+.2,60,.45);son(w(2,2),'pop',820);
 const page=img(s,'img/apk_haut.png',-105,180,.74,'carte');entre(page,T2+.3,500,.6);
 A(page,T2+.3,2.0,{s:[.74,.78]},'out');
 const loupe=mk(s,'','loupe','width:190px;height:190px;border-color:#24cd77');loupe.def.x=445;loupe.def.y=726;pop(loupe,w(2,2)+.15,.35);A(loupe,w(2,4)-.35,.2,{o:[1,0]},'lin');
 // page s'efface vers le haut, carte sécurité arrive
 A(page,w(2,4)-.3,.45,{y:[0,-300],s:[.78,.62],o:[1,.35],b:[0,6]},'inOut');
 const secu=img(s,'img/apk_securite.png',-61,560,.82,'carte');entre(secu,w(2,4)-.3,420,.5);son(w(2,4)-.35,'whoosh2');
 const l1=mk(s,`<div style="display:flex;align-items:center;gap:30px"><span class="chk">${CHECK}</span><span class="T" style="font-size:104px;color:#0b0a0f">Zéro virus</span></div>`);l1.def.x=80;l1.def.y=1290;entre(l1,w(2,4)-.04,60,.4);son(w(2,4),'coche');
 const l2=mk(s,`<div style="display:flex;align-items:center;gap:30px"><span class="chk">${CHECK}</span><span class="T" style="font-size:104px;color:#0b0a0f">Zéro <span class="S" style="font-size:112px">logiciel espion</span></span></div>`);l2.def.x=80;l2.def.y=1450;entre(l2,w(2,6)-.04,60,.4);son(w(2,6),'coche');
 // badge VERIFIED surligné
 const ver=mk(secu,'','', 'border:7px solid #1e63ee;border-radius:60px;width:286px;height:94px');ver.def.x=40;ver.def.y=628;pop(ver,w(2,8),.35,.6);son(w(2,8),'pop',1000);
 for(const o of [tit,secu,l1,l2,page])A(o,T3-.2,.3,{o:[1,0],b:[0,12]},'in');
}
/* =============== 3. LE PRINCIPE : TU DÉCRIS, L'IA CRÉE =============== */
const T4=deb(4)-.18;
{const s=scene(T3,T4+.5,'#5c4cf5','rgba(255,255,255,.08)',3);
 A(s,T3,.5,{y:[1920,0]},'expo');son(T3-.35,'riser');son(deb(3)-.04,'drop');
 const p1=mk(s,'<div class="T c" style="font-size:96px;color:rgba(255,255,255,.75)">Le principe est</div>');p1.def.y=700;entre(p1,deb(3)-.02,60,.35);
 const p2=mk(s,'<div class="S c" style="font-size:300px">simple.</div>');p2.def.y=800;pop(p2,w(3,3)-.06,.45,.6);
 const tD=w(3,4)-.06;
 sort(p1,tD-.1,.25,-80);sort(p2,tD-.1,.25,-80);
 const d1=mk(s,'<div class="T c" style="font-size:150px">Tu décris.</div>');d1.def.y=150;entre(d1,tD,70,.4);son(tD,'whoosh2');
 const bulle=mk(s,`<div style="width:900px;background:#fff;color:#0b0a0f;border-radius:48px 48px 12px 48px;padding:44px 52px;font:600 64px/1.22 I;box-shadow:0 30px 80px rgba(0,0,0,.3)"><span class="tape"></span><span class="car" style="display:inline-block;width:6px;height:64px;background:var(--violet);vertical-align:-8px;margin-left:4px"></span></div>`);
 bulle.def.x=90;bulle.def.y=420;entre(bulle,tD+.1,80,.45);
 const txt='Prise de commande : nom, téléphone, produit, quantité, quartier';
 tape(bulle,txt,tD+.3,w(3,11)-.05);
 for(let k=0;k<12;k++)son(tD+.3+k*(w(3,11)-.35-tD)/12,'touche');
 const tI=w(3,12)-.1;
 // la bulle part dans le téléphone
 A(bulle,tI,.45,{y:[0,780],s:[1,.45],o:[1,0]},'in');
 const d2=mk(s,'<div class="S c" style="font-size:170px;color:var(--jaune)">L’IA crée.</div>');d2.def.y=290;entre(d2,w(3,13)-.05,60,.45);
 const tel=img(s,'img/chat.png',0,640,1,'fondu');tel.def.o=0;A(tel,tI,.1,{o:[0,1]},'lin');A(tel,tI,.7,{y:[1280,0]},'expo');son(tI,'whoosh');
 A(tel,tI+.7,4,{s:[1,1.06]},'out');
 const etc=mk(s,'<div style="font-size:120px">✦</div>','', 'color:var(--jaune)');etc.def.x=880;etc.def.y=250;pop(etc,w(3,16),.5);A(etc,w(3,16),1.5,{r:[-90,30]},'out');son(w(3,16),'etincelle');
 const chip=mk(s,`<span class="pill" style="background:#0b0a0f;color:#fff;font-size:60px">⏱ prêt en quelques secondes</span>`);chip.def.x=95;chip.def.y=1660;pop(chip,w(3,18)-.05,.45,.5);son(w(3,18),'pop',880);
 for(const o of [d1,d2,tel,chip,etc])A(o,T4-.22,.32,{x:[0,-500],o:[1,0],b:[0,16]},'in');
}
/* =============== 4. PARTAGE + LE CLIENT REMPLIT DANS SON NAVIGATEUR =============== */
const T5=deb(5)-.2;
{const s=scene(T4,T5+.5,'#17a34a','rgba(255,255,255,.09)',4);
 A(s,T4-.05,.42,{x:[1080,0],b:[18,0]},'expo');son(T4-.2,'whoosh');
 const t1=mk(s,'<div class="T c" style="font-size:170px">Partage</div>');t1.def.y=120;entre(t1,deb(4)+.05,60,.4);
 const t1b=mk(s,'<div class="S c" style="font-size:120px;color:#d9ffe6">le lien</div>');t1b.def.y=300;entre(t1b,w(4,3)-.05,50,.4);
 const lien=img(s,'img/lien.png',30,470,1,'fondu2');lien.def.o=0;A(lien,w(4,3)-.1,.15,{o:[0,1]},'lin');A(lien,w(4,3)-.1,.6,{x:[-930,0],r:[-14,0]},'expo');son(w(4,3)-.15,'whoosh2');
 // chips groupes / statuts
 const g=mk(s,`<span class="pill" style="background:#fff;color:#0b0a0f;font-size:64px"><img src="${WA}" style="width:70px">Groupes</span>`);g.def.x=70;g.def.y=860;pop(g,w(4,6)-.05,.45,.4);son(w(4,6),'pop',820);
 const st=mk(s,`<span class="pill" style="background:#0b0a0f;color:#fff;font-size:64px"><span style="display:inline-block;width:62px;height:62px;border-radius:50%;border:7px dashed var(--wa)"></span>Statuts</span>`);st.def.x=560;st.def.y=860;pop(st,w(4,9)-.05,.45,.4);son(w(4,9),'pop',960);
 // navigateur du client
 const tN=w(4,10)-.1;
 for(const o of [t1,t1b,lien,g,st])A(o,tN-.05,.32,{y:[0,-700],o:[1,0]},'in');
 // y absolu à corriger
