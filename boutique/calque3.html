<body><div id="scene"></div>
<script src="donnees.js"></script>
<script>
const S=document.getElementById('scene');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=p=>1-Math.pow(1-cl(p),3);
const eob=p=>{p=cl(p);const c=1.6;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const mk=(cls,html='')=>{const d=document.createElement('div');d.className='el '+cls;d.innerHTML=html;S.appendChild(d);return d};
const R=[];
// tampon : écrase l'écran (2,3× → 1× en 0,09 s, rebond), reste, puis file vers le ticket
function tampon(e){
  const d=mk('tampon',`<div class="in" style="font-size:${e.px||118}px">${e.txt}</div>`);
  d.style.left=(e.x??540)+'px';d.style.top=(e.y??860)+'px';
  R.push(t=>{
    const u=t-e.t;const fin=(e.t1??e.t+1.15);
    if(u<0||t>=fin+.28){d.style.display='none';return}
    d.style.display='block';
    let s, o=1, tx=0, ty=0;
    if(u<.09){s=2.3-1.3*(u/.09);o=u/.09}
    else if(u<.22){s=1-.035*Math.sin((u-.09)/.13*Math.PI)}
    else s=1;
    if(t>fin){const q=eo((t-fin)/.28);s*=1-.75*q;o=1-q;tx=(e.vx??300)*q;ty=(e.vy??420)*q}
    d.style.opacity=o;
    d.style.transform=`translate(-50%,-50%) translate(${tx}px,${ty}px) rotate(${e.rot??-9}deg) scale(${s})`;
  });
}
for(const e of D.elements){
  if(e.type==='degrade'){
    const d=mk('deg');d.style.top=(e.haut?0:1920-(e.h||800))+'px';d.style.height=(e.h||800)+'px';
    d.style.background=`linear-gradient(${e.haut?'rgba(0,0,0,'+(e.force||.55)+'),rgba(0,0,0,0)':'rgba(0,0,0,0),rgba(0,0,0,'+(e.force||.6)+')'})`;
    R.push(t=>d.style.display=(t>=e.t0&&t<e.t1)?'block':'none');
  }
  else if(e.type==='question'){
    const d=mk('q');d.style.top=(e.y??210)+'px';d.style.fontSize=(e.px||112)+'px';
    d.innerHTML=e.mots.map(m=>`<span class="${m.cle?'cle':''}">${m.w}</span>`).join('');
    const sp=[...d.querySelectorAll('span')];
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      sp.forEach((s,i)=>{const u=t-e.mots[i].t;
        if(u<0){s.style.opacity=0;return}
        s.style.opacity=1;const p=eob(u/.16);s.style.transform=`translateY(${(1-p)*40}px) scale(${.7+.3*p})`});
      if(e.sortie){const q=eo((t-(e.t1-.14))/.14);d.style.opacity=1-q}});
  }
  else if(e.type==='sous'){
    const d=mk('sous');d.style.top=(e.y??1380)+'px';let cur=-1;
    R.push(t=>{const i=e.groupes.findIndex(g=>t>=g.t0&&t<g.t1);
      if(i<0){d.style.display='none';cur=-1;return}
      d.style.display='block';if(i!==cur){d.innerHTML=e.groupes[i].html;cur=i}
      const p=cl((t-e.groupes[i].t0)/.1);d.style.transform=`scale(${1.06-.06*p})`});
  }
  else if(e.type==='tampon') tampon(e);
  else if(e.type==='pastille'){
    const d=mk('pastille','<div class="rond"><img src="../logo/logo_detoure.png"></div>');
    d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=d.style.height=(e.taille||300)+'px';
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const p=eob((t-e.t0)/.3);d.style.transform=`scale(${p}) rotate(${(1-p)*-30}deg)`});
  }
  else if(e.type==='ticket'){
    const d=mk('ticket',`<div class="papier"><div class="tete"><b>NGUELEK PRINT</b>BON DE COMMANDE N°0237</div>
      <div class="zone"><div class="lst">${e.lignes.map(l=>`<div class="ligne"><span>${l.txt}</span><span class="ok">✓ FAIT</span></div>`).join('')}</div></div></div>`);
    const L=[...d.querySelectorAll('.ligne')],lst=d.querySelector('.lst');
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const p=eo((t-e.t0)/.45),q=e.sortie?eo((t-(e.t1-.3))/.3):0;
      d.style.transform=`translateY(${(1-p)*700+q*700}px) rotate(-2.5deg)`;
      let n=0;L.forEach((l,i)=>{const u=t-e.lignes[i].t;
        if(u<0){l.style.display='none';return}
        l.style.display='flex';n++;
        const k=Math.floor(cl(u/.45)*l.children[0].textContent.length);
        l.children[0].style.clipPath=`inset(0 ${100-100*cl(u/.45)}% 0 0)`;
        l.children[1].style.opacity=u>.5?1:0;l.children[1].style.transform=`scale(${u>.5?eob((u-.5)/.2):0})`;});
    });
  }
  else if(e.type==='fin'){
    const d=mk('fin');
    d.innerHTML=`<div class="recu"><div class="fen"><div class="papier">
      <div class="tete"><img src="../logo/logo_detoure.png">BON DE COMMANDE N°0237</div>
      ${e.lignes.map(l=>`<div class="ligne"><span>${l}</span><span class="ok">✓ FAIT</span></div>`).join('')}
      <div class="tot"><span>TOTAL</span><span>TON IDÉE</span></div>
      <div class="tel"><img src="../../assets/logos/whatsapp.png"><span class="num"></span></div>
      <div class="adr"><b>CARREFOUR MESSASSI</b><br>face au poste de police · Yaoundé<br>Lun – Sam · 7h30 – 18h00 · livraison partout</div>
      <div class="code"></div></div></div></div>`;
    const fen=d.querySelector('.fen'),pap=d.querySelector('.papier'),num=d.querySelector('.num'),recu=d.querySelector('.recu');
    tampon({t:e.t_tampon,t1:e.t1+5,txt:e.tampon,px:124,x:560,y:1700,rot:-9});
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const u=t-e.t0;
      d.style.opacity=cl(u/.2);
      // l'imprimante sort le ticket : la fenêtre s'agrandit par à-coups (ligne par ligne)
      const H=pap.offsetHeight, cible=cl(u/e.duree_impression)*H;
      fen.style.height=Math.max(60,Math.floor(cible/50)*50)+'px';
      recu.style.transform=`translateY(${Math.max(0,(H-Math.max(60,cible)))*0.0}px)`;
      // numéro tapé au rythme de la voix
      num.textContent=e.numero.filter(n=>t>=n.t).map(n=>n.txt).join(' ');
    });
  }
}
window.DUREE=D.duree;
window.render=t=>{for(const f of R)f(t)};
Promise.all([document.fonts.load('80px Anton'),document.fonts.load('30px Mono'),document.fonts.ready,
  ...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{render(0);window.PRET=true});
</script></body></html>
