/* ---------- temps forts de Claude : [mot déclencheur, titre, ligne de code, icône] ---------- */

 r2:[['disparaît','IL NE DISPARAÎT PAS','monteur.disparaitre(); // false','user'],
  ['étage',"IL MONTE D'UN ÉTAGE",'monteur.niveau++;','stairs'],
  ['silences','COUPER LES SILENCES','ia.couper(silences);','scissors'],
  ['sous-titrer','SOUS-TITRER','ia.sousTitrer(video);','subtitles'],
  ['effets','CALER LES EFFETS','ia.caler(effets);','speaker'],
  ['minutes','EN QUELQUES MINUTES','// avant : 3 heures. maintenant : 3 min','clock'],
  ['goût','LE GOÛT','const humain = { gout,','heart'],
  ['rythme','LE RYTHME','  rythme,','wave'],
  ['public','CE QUI TOUCHE TON PUBLIC','  public };','users'],

const rep=SEGS.filter(s=>s.type==='claude'&&!s.accroche);
const qs=SEGS.filter(s=>s.type==='lui'&&s.q<=5); qs.forEach((s,i)=>s.nq=i+1); const NQ=qs.length;
SEGS.forEach(s=>{
 if(s.type==='claude'){
  const liste=BEATS[s.accroche?'accroche':s.cle]; s.beats=[]; let j=0;
  for(const [m,ti,co,ic] of liste){
   let k=j; while(k<s.mots.length&&!egal(s.mots[k][0],m))k++;

   s.beats.push({t:s.accroche&&!s.beats.length?-.15:s.mots[k][1]-.04,ti,co,ic}); j=k+1;
  }

  // enveloppe lissée (attaque rapide, retombée lente) + attaques de syllabes
  const E=s.env, n=E.length; s.sm=[]; let p=[0,0,0];

  for(let k=3;k<n;k++){const d=(s.sm[k][1]+s.sm[k][0])-(s.sm[k-3][1]+s.sm[k-3][0]);if(d>.42&&k-last>7){s.on.push(k/30);last=k}}

// groupes de sous-titres
const GR=[]; {let g=null;

  if(/[.?!:]$/.test(txt))g.len=99;
 });
 GR.forEach(g=>g.a=g.w[0].a-.06);
 GR.forEach((g,i)=>{const s=SEGS[g.seg];const nx=GR[i+1];
  g.b=Math.min(nx&&nx.seg===g.seg?nx.a-.06:g.w[g.w.length-1].b+.5,s.t1)});
}

 const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 const ci=l.indexOf('//'); let a=ci>=0?l.slice(0,ci):l, c=ci>=0?l.slice(ci):'';
 a=esc(a).replace(/("[^"]*"?)|\b(const|await|return|true|false)\b|(\b\d+\b)|([A-Za-zéèàç_]+)(?=\()/g,(m,s,k,n,f)=>s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:n?`<span class="n">${n}</span>`:`<span class="f">${f}</span>`);
 return a+(c?`<span class="c">${esc(c)}</span>`:'');
}

function logo(t,s,tl){

 if(k>=0&&i0<s.sm.length){const A=at(i0),B=at(i0+1);b=A.map((v,j)=>lerp(v,B[j],fr))}
 const E=clamp(b[0]*.45+b[1]*.4+b[2]*.25,0,1.3);
 const app=s.accroche?1:eo(clamp(tl/.38));

 for(const o of s.on){const d=(tl-(s.tv-s.t0))-o; if(d<0||d>.9)continue;
  const r=150+d*420; cx.strokeStyle=`rgba(217,119,87,${(1-d/.9)*.55})`;cx.lineWidth=6*(1-d/.9)+1;
  cx.beginPath();cx.arc(X,Y,r,0,7);cx.stroke()}
 // halo

 g.addColorStop(0,`rgba(255,170,130,${.35+.45*E})`);g.addColorStop(1,'rgba(217,119,87,0)');
 cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,260,0,7);cx.fill();
 // spectre circulaire
 const NB=84,R0=215*app+.01;
 for(let i=0;i<NB;i++){const a=i/NB*Math.PI*2-Math.PI/2;
  const v=(b[0]*(.5+.5*Math.sin(a*3+t*2.1))+b[1]*(.5+.5*Math.sin(a*5-t*3.3+1))+b[2]*(.5+.5*Math.sin(a*9+t*5.1+2)))/1.4;
  const L=(6+78*clamp(v,0,1.2))*app;
  cx.strokeStyle=`rgba(${Math.round(lerp(244,255,v))},${Math.round(lerp(237,140,v))},${Math.round(lerp(228,100,v))},${.35+.6*clamp(v)})`;
  cx.lineWidth=7;cx.lineCap='round';cx.beginPath();
  cx.moveTo(X+Math.cos(a)*R0,Y+Math.sin(a)*R0);cx.lineTo(X+Math.cos(a)*(R0+L),Y+Math.sin(a)*(R0+L));cx.stroke()}
 // étoile de rayons (le « logo » qui parle)
 const NR=12, rot=t*.22+E*.12;

  const bi=b[i%3], base=118*(.74+.32*H(i+20));
  const L=base*app*(.80+.55*bi+.12*Math.sin(t*3+i));
  const w0=22,w1=11;
  cx.save();cx.rotate(a);cx.fillStyle=CORAIL;
  cx.beginPath();cx.moveTo(14,-w0/2);cx.lineTo(L,-w1/2);cx.arc(L,0,w1/2,-Math.PI/2,Math.PI/2);cx.lineTo(14,w0/2);cx.closePath();cx.fill();
  cx.restore();
 }
 cx.shadowBlur=0;cx.fillStyle='#f6c2ab';cx.beginPath();cx.arc(0,0,(20+12*E)*app,0,7);cx.fill();
 cx.restore();
 return E;
}
