<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Sans;src:url('../../fonts/InterTight-ExtraBold.ttf')}
@font-face{font-family:Serif;src:url('../../fonts/InstrumentSerif-Italic.ttf')}
@font-face{font-family:SerifD;src:url('../../fonts/InstrumentSerif-Regular.ttf')}
:root{--c:#00A0E3;--m:#E5007D;--j:#FFE500;--n:#121212;--papier:#F7F4EE}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
#scene{position:absolute;inset:0;overflow:hidden}
.el{position:absolute;display:none}
.sans{font-family:Sans;letter-spacing:-.02em;text-transform:uppercase}
.serif{font-family:Serif;letter-spacing:-.01em}
.ombre{text-shadow:0 4px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}
.ligne{display:block;overflow:hidden;padding:0 .06em;line-height:1.0}
.ligne>span{display:inline-block;position:relative;will-change:transform}
.fond{padding:.06em .22em .1em;border-radius:6px}
.barre{position:absolute;left:-4%;top:52%;height:.11em;background:var(--m);transform-origin:left center;border-radius:4px}
/* chapitre */
.chap .num{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Serif;font-size:132px;line-height:1;padding-top:10px;box-sizing:border-box}
.chap .nom{position:absolute;left:0;top:172px;white-space:nowrap;font-size:76px;color:#fff;line-height:1.02}
.chap .sous{position:absolute;left:4px;font-family:Serif;font-size:56px;color:#fff;white-space:nowrap}
.deg{position:absolute;left:0;width:1080px}
.detail{display:none;position:absolute;background:#fff;color:#111;border-radius:60px;padding:16px 34px 18px 30px;font-family:Sans;font-size:40px;text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.detail i{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:16px;vertical-align:middle;position:relative;top:-3px}
.sous-t{position:absolute;left:60px;width:960px;text-align:center;color:#fff;font-family:Sans;font-size:70px;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05}
.sous-t em{font-family:Serif;font-style:normal;text-transform:none;font-size:92px;color:var(--j);letter-spacing:0}
.bande{position:absolute;top:-240px;height:2400px;width:1000px;transform-origin:center}
.logo{position:absolute}
.logo img{position:absolute;left:0;top:0;width:100%;height:100%}
.logo .disque{position:absolute;left:1.5%;top:9%;width:97%;height:79%;border-radius:50%;background:#fff}
.etiq{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--j);color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 14px 50px rgba(0,0,0,.4);text-align:center}
.etiq b{font-family:Sans;font-size:92px;line-height:.9;letter-spacing:-.03em}
.etiq s{font-family:Serif;text-decoration:none;font-size:52px;line-height:1}
.etiq u{font-family:Sans;text-decoration:none;font-size:40px;line-height:1}
.fin .ligne-info{position:absolute;left:0;width:1080px;text-align:center;color:#111}
.flash{position:absolute;inset:0;background:#fff}
</style></head>
<body><div id="scene"></div>
<script src="donnees.js"></script>
<script>
const S=document.getElementById('scene');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=p=>1-Math.pow(1-cl(p),3);                 // sortie douce
const eob=p=>{p=cl(p);const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}; // léger dépassement
const COUL={c:'var(--c)',m:'var(--m)',j:'var(--j)',n:'var(--n)',b:'#fff'};
const col=c=>COUL[c]||c||'#fff';
const mk=(html,cls='el')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;S.appendChild(d);return d};
const LOGO=['anneau','N','P','vague_c','vague_m','vague_j','vague_n','guelek','print'];
const R=[];   // fonctions de rendu

function logoDOM(parent,taille){
  const L=document.createElement('div');L.className='logo';L.style.width=L.style.height=taille+'px';
  L.innerHTML='<div class="disque"></div>'+LOGO.map(k=>`<img data-k="${k}" src="../logo/calque_${k}.png">`).join('');
  parent.appendChild(L);
  const im={};L.querySelectorAll('img').forEach(i=>im[i.dataset.k]=i);
  const disque=L.querySelector('.disque');
  // anime le logo : u = temps depuis le début de l'animation
  L.anime=function(u){
    const a=(k,o,tr)=>{im[k].style.opacity=o;im[k].style.transform=tr};
    const p0=eob(u/.32);
    disque.style.transform=`scale(${.2+.8*p0})`;disque.style.opacity=cl(u/.12);
    const pN=eob((u-.08)/.3), pP=eob((u-.16)/.3);
    a('N',cl((u-.08)/.08),`translateX(${(1-pN)*-260}px)`);
    a('P',cl((u-.16)/.08),`translateY(${(1-pP)*-300}px)`);
    ['vague_c','vague_m','vague_j','vague_n'].forEach((k,i)=>{
      const p=eob((u-.34-i*.07)/.32);
      im[k].style.transformOrigin='52% 57%';
      a(k,cl((u-.34-i*.07)/.06),`rotate(${(1-p)*-70}deg) scale(${.5+.5*p})`);
    });
    const pg=eo((u-.62)/.3);
    a('guelek',cl((u-.62)/.1),`translateY(${(1-pg)*60}px)`);a('print',cl((u-.68)/.1),`translateY(${(1-eo((u-.68)/.3))*60}px)`);
    const pa=eo((u-.5)/.45);
    a('anneau',cl((u-.5)/.15),`scale(${1.18-.18*pa})`);
    L.style.transform=`scale(${1+.025*cl((u-1)/3)})`;
  };
  return L;
}

for(const e of D.elements){
  if(e.type==='titre'){
    const d=mk(e.lignes.map((l,i)=>`<div class="ligne" style="text-align:${e.align||'left'}"><span class="${l.police||'sans'} ${l.fond?'fond':'ombre'}" style="font-size:${l.px}px;color:${col(l.coul)};${l.fond?'background:'+col(l.fond):''};${l.ls?'letter-spacing:'+l.ls:''}">${l.txt}${l.barre!=null?'<i class="barre"></i>':''}</span></div>`).join(''));
    d.style.left=(e.x??70)+'px';d.style.top=e.y+'px';d.style.width=(e.w??940)+'px';
    if(e.rot)d.style.transform=`rotate(${e.rot}deg)`;
    const sp=[...d.querySelectorAll('.ligne>span')];const br=[...d.querySelectorAll('.barre')];
    R.push(t=>{
      const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      sp.forEach((s,i)=>{const ti=e.t0+(e.lignes[i].dt??i*.09);const p=eo((t-ti)/.3);
        let y=(1-p)*110; if(e.sortie==='glisse'){const q=eo((t-(e.t1-.22))/.22);y-=q*110}
        s.style.transform=`translateY(${y}%)`;});
      let k=0;e.lignes.forEach(l=>{if(l.barre!=null){br[k].style.transform=`scaleX(${eo((t-l.barre)/.22)})`;br[k].style.width='108%';k++}});
    });
  }
  else if(e.type==='chapitre'){
    const d=mk(`<div class="deg" style="top:0;height:720px;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,0))"></div>
      <div class="chap" style="position:absolute;left:66px;top:200px">
       <div class="num" style="background:${col(e.coul)};color:${e.coul==='n'?'#fff':'#111'}">${e.num}</div>
       <div class="nom sans ombre"><div class="ligne"><span>${e.nom}</span></div>${e.nom2?`<div class="ligne"><span>${e.nom2}</span></div>`:''}</div>
       ${e.sous?`<div class="sous ombre" style="top:${e.nom2?354:262}px"><div class="ligne"><span>${e.sous}</span></div></div>`:''}
      </div>`);
    d.style.inset='0';
    const num=d.querySelector('.num'),sp=[...d.querySelectorAll('.ligne>span')],dg=d.querySelector('.deg');
    R.push(t=>{
      const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const u=t-e.t0;
      num.style.transform=`scale(${eob(u/.3)}) rotate(${(1-eo(u/.4))*-14}deg)`;
      sp.forEach((s,i)=>s.style.transform=`translateY(${(1-eo((u-.1-i*.08)/.32))*115}%)`);
      dg.style.opacity=cl(u/.2);
    });
  }
  else if(e.type==='detail'){
    const d=mk(`<i style="background:${col(e.coul||'m')}"></i>${e.txt}`,'detail');
    d.style.left=(e.x??66)+'px';d.style.top=(e.y??1480)+'px';
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const p=eob((t-e.t0)/.25);d.style.transform=`scale(${.4+.6*p})`;d.style.transformOrigin='left center';d.style.opacity=cl((t-e.t0)/.06)});
  }
  else if(e.type==='sous'){
    const d=mk('','sous-t');d.style.top=(e.y??1180)+'px';
    let cur=-1;
    R.push(t=>{
      const i=e.groupes.findIndex(g=>t>=g.t0&&t<g.t1);
      if(i<0){d.style.display='none';cur=-1;return}
      const g=e.groupes[i];d.style.display='block';
      if(i!==cur){d.innerHTML=g.html;cur=i}
      d.style.top=(g.y??e.y??1180)+'px';
      const p=cl((t-g.t0)/.12);d.style.transform=`scale(${1.08-.08*p})`;
    });
  }
  else if(e.type==='balayage'){
    const cols=e.couleurs||['c','m','j','n'];
    const bs=cols.map(c=>{const b=document.createElement('div');b.className='bande';b.style.background=col(c);S.appendChild(b);b.style.display='none';return b});
    R.push(t=>{
      const u=(t-e.t)/.32;   // -1..1
      if(u<-1||u>1){bs.forEach(b=>b.style.display='none');return}
      const X=430+1750*Math.sign(u)*Math.pow(Math.abs(u),1.6);
      bs.forEach((b,k)=>{b.style.display='block';const x=X-(cols.length-1-k)*260;
        b.style.transform=`translateX(${x-500}px) skewX(-14deg)`;b.style.left='0px';b.style.zIndex=50+k});
    });
  }
  else if(e.type==='logo'){
    const d=mk('');d.style.inset='0';
    d.style.background=e.fond||'var(--papier)';
    const L=logoDOM(d,e.taille||900);L.style.left=(1080-(e.taille||900))/2+'px';L.style.top=(e.y??480)+'px';
    let sl=null;
    if(e.slogan){sl=document.createElement('div');sl.className='el';sl.style.cssText=`display:block;left:0;width:1080px;top:${(e.y??480)+(e.taille||900)+10}px;text-align:center`;
      sl.innerHTML=e.slogan.map(l=>`<div class="ligne"><span class="${l.police}" style="font-size:${l.px}px;color:${col(l.coul)}">${l.txt}</span></div>`).join('');d.appendChild(sl)}
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      L.anime(t-e.t0);
      if(sl)[...sl.querySelectorAll('.ligne>span')].forEach((s,i)=>s.style.transform=`translateY(${(1-eo((t-e.t0-1.0-i*.1)/.35))*115}%)`);
    });
  }
  else if(e.type==='fin'){
    const d=mk('');d.style.inset='0';d.className='el fin';d.style.background='var(--papier)';
    // bandes CMJN en bas, inclinées comme les vagues du logo
    const deco=document.createElement('div');deco.style.cssText='position:absolute;left:-200px;top:1710px;width:1500px;height:420px;transform:rotate(-8deg)';
    deco.innerHTML=['c','m','j','n'].map((c,i)=>`<div style="height:46px;margin-bottom:8px;background:${col(c)};transform-origin:left;border-radius:0 30px 30px 0"></div>`).join('');
    d.appendChild(deco);const deb=[...deco.children];
    const L=logoDOM(d,640);L.style.left='220px';L.style.top='120px';
    const acc=document.createElement('div');acc.style.cssText='position:absolute;left:0;width:1080px;top:770px;text-align:center';
    acc.innerHTML=e.accroche.map(l=>`<div class="ligne"><span class="${l.police}" style="font-size:${l.px}px;color:${col(l.coul)};${l.fond?'background:'+col(l.fond)+';padding:0 .2em;border-radius:8px':''}">${l.txt}</span></div>`).join('');
    d.appendChild(acc);
    const info=document.createElement('div');info.style.cssText='position:absolute;left:0;width:1080px;top:1150px;text-align:center;color:#111';
    info.innerHTML=`
      <div class="ligne"><span><svg width="54" height="64" viewBox="0 0 24 28" style="vertical-align:-10px;margin-right:14px"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 28 12 28s12-7.6 12-16.3C24 5.2 18.6 0 12 0z" fill="#E5007D"/><circle cx="12" cy="11.5" r="4.6" fill="#fff"/></svg><b class="sans" style="font-size:58px">${e.lieu1}</b></span></div>
      <div class="ligne" style="margin-top:6px"><span class="serif" style="font-size:54px">${e.lieu2}</span></div>
      <div class="ligne" style="margin-top:40px"><span style="display:inline-flex;align-items:center;background:#111;color:#fff;border-radius:90px;padding:18px 46px 20px 24px"><img src="../../assets/logos/whatsapp.png" style="width:92px;height:92px;margin-right:22px;background:#fff;border-radius:50%;padding:6px;box-sizing:border-box"><b class="sans" style="font-size:96px;letter-spacing:-.01em">${e.tel}</b></span></div>
      <div class="ligne" style="margin-top:26px"><span class="sans" style="font-size:40px;color:#333">${e.horaires}</span></div>
      ${e.plus?`<div class="ligne" style="margin-top:10px"><span class="serif" style="font-size:44px;color:#333">${e.plus}</span></div>`:''}`;
    d.appendChild(info);
    const sa=[...acc.querySelectorAll('.ligne>span')],si=[...info.querySelectorAll('.ligne>span')];
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const u=t-e.t0;L.anime(u);
      deb.forEach((b,i)=>b.style.transform=`scaleX(${eo((u-.2-i*.06)/.5)})`);
      sa.forEach((s,i)=>s.style.transform=`translateY(${(1-eo((u-.9-i*.12)/.35))*115}%)`);
      si.forEach((s,i)=>s.style.transform=`translateY(${(1-eo((u-1.4-i*.12)/.35))*115}%)`);
      // pulsation douce du numéro
      const ph=si[2];if(ph&&u>2.4)ph.style.transform=`scale(${1+.03*Math.sin((u-2.4)*5)})`;
    });
  }
  else if(e.type==='etiquette'){
    const d=mk(`<div class="etiq" style="background:${col(e.coul||'j')}"><s>${e.haut}</s><b>${e.milieu}</b><u>${e.bas}</u></div>`);
    d.style.left=e.x+'px';d.style.top=e.y+'px';
    R.push(t=>{const on=t>=e.t0&&t<e.t1;d.style.display=on?'block':'none';if(!on)return;
      const p=eob((t-e.t0)/.35);d.style.transform=`scale(${p}) rotate(${(e.rot||-10)+(1-p)*-40}deg)`});
  }
  else if(e.type==='flash'){
    const d=mk('','flash');
    R.push(t=>{const u=(t-e.t)/(e.d||.12);d.style.display=(u>=0&&u<1)?'block':'none';d.style.opacity=1-u});
  }
  else if(e.type==='degrade'){
    const d=mk('');d.style.cssText+=`;left:0;width:1080px;top:${e.haut?0:1920-(e.h||800)}px;height:${e.h||800}px;background:linear-gradient(${e.haut?'rgba(0,0,0,'+(e.force||.6)+'),rgba(0,0,0,0)':'rgba(0,0,0,0),rgba(0,0,0,'+(e.force||.6)+')'})`;
    R.push(t=>{d.style.display=(t>=e.t0&&t<e.t1)?'block':'none'});
  }
}
window.DUREE=D.duree;
window.render=t=>{for(const f of R)f(t)};
Promise.all([document.fonts.load('80px Sans'),document.fonts.load('80px Serif'),document.fonts.load('80px SerifD'),document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{render(0);window.PRET=true});
</script></body></html>
