<style>

<script>
const W=1080,H=1920,stage=document.getElementById('stage');
const P=TL.phrases;
const w=(p,k)=>P[p-1].mots[k][1];             /* début du k-ième mot de la phrase p */
const deb=p=>P[p-1].debut, fin=p=>P[p-1].fin;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-11*x),in:x=>x*x*x,
 inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 elas:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const SONS=[]; const son=(t,k,x=0)=>SONS.push([+t.toFixed(3),k,x]);
const els=[];const DY=120;   /* tout le contenu des scènes descend : centré dans la zone 4:5 du fil, hors bandeau du haut */
function mk(par,html,cls='',style='',def={}){const d=document.createElement('div');d.className='abs '+cls;d.style.cssText=style;d.innerHTML=html;(par.el||par).appendChild(d);
 const o={dy:(par.isScene?DY:0),el:d,anims:[],def:Object.assign({x:0,y:0,s:1,r:0,o:1,b:0,sx:1,cr:-1},def)};els.push(o);return o}
function A(o,t0,dur,props,ease='out'){o.anims.push({t0,dur,props,ease});return o}
/* apparition « pro » : montée + flou qui se dissipe */
function entre(o,t0,dy=70,d=.45){o.def.o=0;return A(o,t0,d,{o:[0,1],y:[dy,0],b:[14,0]},'out')}
function pop(o,t0,d=.42,s0=0){o.def.o=0;A(o,t0,.12,{o:[0,1]},'lin');return A(o,t0,d,{s:[s0,1]},'back')}
function sort(o,t0,d=.25,dy=-60){return A(o,t0,d,{o:[1,0],y:[0,dy],b:[0,10]},'in')}
function render(t){
 for(const o of els){
  const st={...o.def,x:0,y:0},set={};
  for(const a of o.anims)for(const k in a.props){
   const [f,to]=a.props[k];
   if(t>=a.t0){st[k]=f+(to-f)*E[a.ease](clamp((t-a.t0)/a.dur));set[k]=1}
   else if(!set[k]){st[k]=f;set[k]=1}
  }
  const e=o.el,op=clamp(st.o);
  if(o.fen){const vis=t>=o.fen[0]&&t<o.fen[1];e.style.display=vis?'block':'none';if(!vis)continue}
  e.style.opacity=op;e.style.visibility=op<=.002?'hidden':'visible';
  e.style.transform=`translate3d(${o.def.x+st.x}px,${o.def.y+st.y+o.dy}px,0) rotate(${st.r}deg) scale(${st.s*st.sx},${st.s})`;
  e.style.filter=st.b>.2?`blur(${st.b.toFixed(1)}px)`:'none';
  if(st.cr>=0)e.style.clipPath=`circle(${st.cr}px at ${o.cx||540}px ${o.cy||960}px)`;
  if(o.tick)o.tick(t,e,st);
 }
}
/* scène : fond + grille, visible sur [a,b] */
function scene(a,b,fond,grille='rgba(255,255,255,.07)',z=0){
 const s=mk(stage,`<div class="grille" style="--g:${grille}"></div>`,'sc',`background:${fond};z-index:${z}`);
 s.fen=[a,b];s.isScene=true;const g=s.el.firstChild;s.tick=(t)=>{g.style.transform=`translate(${(-(t*14)%72).toFixed(1)}px,${(-(t*9)%72).toFixed(1)}px)`};return s}
function img(par,src,x,y,s=1,cls='',style=''){const o=mk(par,`<img src="${src}">`,'crop '+cls,style);o.def.x=x;o.def.y=y;o.def.s=s;return o}
/* texte qui se tape */
function tape(o,txt,t0,t1,curseur=true){const n=o.el.querySelector('.tape');o.tick=(t)=>{const k=Math.round(clamp((t-t0)/(t1-t0))*txt.length);
 n.textContent=txt.slice(0,k);const c=o.el.querySelector('.car');if(c)c.style.opacity=(curseur&&(t<t1+.6?Math.floor(t*3)%2===0||t<t1:false))?1:0}}
/* compteur */
function compte(o,sel,v0,v1,t0,d,fmt=v=>Math.round(v)){const n=o.el.querySelector(sel);const old=o.tick;o.tick=(t,e,st)=>{old&&old(t,e,st);n.textContent=fmt(v0+(v1-v0)*E.out(clamp((t-t0)/d)))}}
/* curseur (main) */
const MAIN=`<svg width="92" height="92" viewBox="0 0 24 24"><path d="M9 2.5c.8 0 1.5.7 1.5 1.5v6.3l.9-.2c.9-.1 1.6.5 1.7 1.3l.1.6.8-.1c.9-.1 1.6.5 1.7 1.3l.1.5.6-.1c.9-.1 1.7.5 1.7 1.4v3.6c0 2.6-2.1 4.9-4.8 4.9h-2.6c-1.6 0-3-.8-3.9-2.1L3.4 15c-.5-.7-.3-1.6.4-2.1.6-.4 1.4-.3 1.9.2l1.8 1.9V4c0-.8.7-1.5 1.5-1.5z" fill="#fff" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
function curseur(par,pts,clics){ /* pts: [[t,x,y],...] ; clics: [t,...] */
 const o=mk(par,MAIN+'<div class="onde" style="position:absolute;left:-30px;top:-34px;width:80px;height:80px;border-radius:50%;border:5px solid #fff;opacity:0"></div>','', 'z-index:50;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))');
 o.def.o=0;A(o,pts[0][0]-.15,.2,{o:[0,1]},'lin');
 const X0=pts[0][1],Y0=pts[0][2];for(let i=1;i<pts.length;i++)A(o,pts[i-1][0],pts[i][0]-pts[i-1][0],{x:[pts[i-1][1]-X0,pts[i][1]-X0],y:[pts[i-1][2]-Y0,pts[i][2]-Y0]},'inOut');
 o.def.x=X0-35;o.def.y=Y0-10;
 for(const c of clics){A(o,c-.08,.08,{s:[1,.82]},'out');A(o,c,.18,{s:[.82,1]},'out');son(c,'clic')}
 const onde=o.el.querySelector('.onde');
 o.tick=(t)=>{let k=-1;for(const c of clics)if(t>=c&&t<c+.45)k=(t-c)/.45;onde.style.opacity=k<0?0:1-k;onde.style.transform=`scale(${k<0?0:.5+k*1.6})`};
 return o}
/* surligneur qui balaie */
function surl(par,x,y,wd,h,t0,r=0){const o=mk(par,'','surl',`width:${wd}px;height:${h}px`);o.def.x=x;o.def.y=y;o.def.r=r;o.def.sx=0;o.el.style.transformOrigin='0 50%';A(o,t0,.35,{sx:[0,1]},'out');return o}
const CHECK=`<svg viewBox="0 0 24 24" width="52" height="52"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CROIX=`<svg viewBox="0 0 24 24" width="48" height="48"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg>`;
/* tremblement + séparation RVB (glitch) sur [t0, t0+d] */
const hasard=k=>{const x=Math.sin(k*127.1)*43758.5453;return x-Math.floor(x)};
function secousse(o,t0,d=.4,amp=16,rvb=false){const old=o.tick;o.tick=(t,e,st)=>{old&&old(t,e,st);const k=t-t0;
 if(k>0&&k<d){const f=1-k/d,n=Math.floor(t*60);e.style.transform+=` translate(${((hasard(n)-.5)*2*amp*f).toFixed(1)}px,${((hasard(n+7)-.5)*2*amp*f).toFixed(1)}px)`;
  if(rvb)e.style.textShadow=`${(8*f).toFixed(1)}px 0 rgba(255,0,60,.8),${(-8*f).toFixed(1)}px 0 rgba(0,220,255,.8)`}else if(rvb)e.style.textShadow='none'}}
const fin12=fin(12);

/* =============== 1. HOOK : EXCEL TE BLOQUE ENCORE ? (0 → phrase 2) =============== */
const T2=deb(2)-.1;
{const s=scene(0,T2+.5,'radial-gradient(120% 75% at 50% 35%,#0b4a2a 0%,#03140b 70%)','rgba(255,255,255,.05)',1);
 // visible dès l'image 0 : le tableur en erreur + le mot EXCEL
 const ex=mk(s,'<div class="T c" style="font-size:250px">Excel</div>');ex.def.y=280;A(ex,0,.35,{s:[1.1,1]},'expo');son(0,'impact');
 const bl=mk(s,'<div class="S c" style="font-size:132px;color:var(--lime)">te bloque encore ?</div>');bl.def.y=520;entre(bl,w(1,2)-.08,50,.35);
 const feuille=mk(s,`<div class="carte" style="width:900px;overflow:hidden">
   <div class="fx"><span style="color:#666">C2</span><i>fx</i><span class="M" style="font-size:34px">=RECHERCHEV(A2;Clients!A:C;3;FAUX)</span></div>
   <table class="xl" style="width:100%"><tr class="h"><td class="n"></td><td>A</td><td>B</td><td>C</td></tr>
   <tr><td class="n">1</td><td><b>Client</b></td><td><b>Code</b></td><td><b>Téléphone</b></td></tr>
   <tr><td class="n">2</td><td>Awa</td><td>C-104</td><td class="r e1"></td></tr>
   <tr><td class="n">3</td><td>Boris</td><td>C-221</td><td class="r e2"></td></tr>
   <tr><td class="n">4</td><td>Moussa</td><td>C-087</td><td class="r e3"></td></tr></table></div>`);
 feuille.def.x=90;feuille.def.y=730;feuille.def.r=-3;A(feuille,0,.6,{y:[90,0],r:[-8,-3]},'expo');
 const errs=[['.e1','#N/A',.12],['.e2','#NOM?',w(1,3)],['.e3','#VALEUR!',w(1,5)]];
 feuille.tick=(t,e)=>{for(const [c,v,a] of errs){const n=e.querySelector(c);n.textContent=t>=a?v:'';n.style.cssText=t>=a?'color:#dc2626;font-weight:700;background:#fee2e2':''}};
 errs.forEach(([c,v,a],i)=>{if(i)son(a,'erreur')});son(.12,'erreur');
 secousse(feuille,w(1,3),.3,10);secousse(feuille,w(1,5),.3,10);
 // tampon géant #N/A sur « formules »
 const tf=w(1,7)-.05;
 const tam=mk(s,'<div class="T c" style="font-size:230px;color:var(--rouge)">#N/A</div>');tam.def.y=1180;tam.def.r=-6;tam.def.o=0;
 A(tam,tf,.08,{o:[0,1]},'lin');A(tam,tf,.35,{s:[2.2,1],b:[20,0]},'expo');secousse(tam,tf+.1,.35,18,true);son(tf,'boom');
 for(const o of [ex,bl,feuille,tam])A(o,T2-.05,.3,{s:[1,.9],o:[1,0],b:[0,10]},'in');
}
/* =============== 2. ARRÊTE D'APPRENDRE LES FORMULES PAR CŒUR =============== */
const T3=deb(3)-.22;
{const s=scene(T2,T3+.6,'var(--menthe)','rgba(6,51,28,.06)',2);
 s.cx=540;s.cy=960;s.def.cr=0;A(s,T2,.5,{cr:[0,2300]},'inOut');son(T2-.05,'whoosh');
 const ar=mk(s,'<div class="T c" style="font-size:210px;color:var(--sapin)">Arrête</div>');ar.def.y=290;pop(ar,deb(2)-.02,.4,1.4);son(deb(2),'impact2');
 const ap=mk(s,'<div class="S c" style="font-size:120px;color:var(--sapin)">d’apprendre les formules</div>');ap.def.y=500;entre(ap,w(2,2)-.06,50,.38);
 const F=['SOMME.SI.ENS(','RECHERCHEV(','SIERREUR(','INDEX(EQUIV(','NB.SI.ENS(','SOMMEPROD('];
 const fs=F.map((f,i)=>{const o=mk(s,`<span class="pill M" style="background:#fff;color:var(--sapin);font-size:56px;box-shadow:0 14px 34px rgba(6,51,28,.14);border:3px solid #dfe8e1">=${f}…</span>`);
  o.def.x=[70,430,120,470,90,400][i];o.def.y=720+i*100;o.def.r=[-4,3,-2,4,-3,2][i];pop(o,w(2,4)-.1+i*.07,.35,.4);son(w(2,4)-.1+i*.07,'pop',700+i*90);return o});
 // tout est barré sur « par cœur »
 const tb=w(2,5)-.05;
 const barre=mk(s,'','', 'width:880px;height:20px;border-radius:10px;background:var(--rouge)');barre.def.x=100;barre.def.y=1010;barre.def.r=-14;barre.def.sx=0;A(barre,tb,.28,{sx:[0,1]},'expo');son(tb,'raye');
 const barre2=mk(s,'','', 'width:880px;height:20px;border-radius:10px;background:var(--rouge)');barre2.def.x=100;barre2.def.y=1010;barre2.def.r=14;barre2.def.sx=0;A(barre2,tb+.16,.28,{sx:[0,1]},'expo');son(tb+.16,'raye');
 fs.forEach(o=>A(o,tb+.1,.3,{o:[1,.35]},'out'));
 const pc=mk(s,'<div class="c"><span class="T" style="font-size:120px;color:#fff;background:var(--rouge);padding:10px 40px;border-radius:24px;display:inline-block">par cœur</span></div>');pc.def.y=1340;pc.def.r=-4;pop(pc,w(2,5)-.02,.4,1.6);
 for(const o of [ar,ap,barre,barre2,pc,...fs])A(o,T3-.05,.3,{y:[0,-1200]},'in');
}
/* =============== 3. DROP : ÉCRIS CE QUE TU VEUX, EN FRANÇAIS =============== */
const T4=deb(4)-.15;
{const s=scene(T3,T4+.5,'var(--lime)','rgba(6,51,28,.08)',3);
 A(s,T3,.5,{y:[1920,0]},'expo');son(T3-.4,'riser');son(deb(3)-.02,'drop');
 const ec=mk(s,'<div class="T c" style="font-size:190px;color:var(--sapin)">Écris</div>');ec.def.y=290;entre(ec,deb(3),60,.35);
 const fr=mk(s,'<div class="S c" style="font-size:150px;color:var(--sapin)">en français.</div>');fr.def.y=480;pop(fr,w(3,6)-.06,.45,.5);son(w(3,6),'pop',900);
 const sv=mk(s,'<div class="T c" style="font-size:64px;color:rgba(6,51,28,.7)">ce que tu veux</div>');sv.def.y=470;entre(sv,w(3,2)-.05,40,.3);sort(sv,w(3,6)-.12,.18,-30);
 const bulle=mk(s,`<div style="width:920px;background:#fff;color:var(--encre);border-radius:50px 50px 50px 14px;padding:44px 52px;font:600 62px/1.24 I;box-shadow:0 30px 80px rgba(6,51,28,.25)"><div style="font:700 34px I;color:var(--vif);margin-bottom:16px;letter-spacing:.04em">TOI</div><span class="tape"></span><span class="car" style="display:inline-block;width:6px;height:62px;background:var(--vif);vertical-align:-8px;margin-left:4px"></span></div>`);
 bulle.def.x=80;bulle.def.y=720;entre(bulle,w(3,1)-.05,80,.4);
 const txt='Je veux le total des ventes de Savon faites par Awa.';
 tape(bulle,txt,w(3,1)+.1,fin(3)+.15);for(let k=0;k<14;k++)son(w(3,1)+.15+k*(fin(3)-w(3,1)-.1)/14,'touche');
 const env=mk(s,`<span style="width:120px;height:120px;border-radius:50%;background:var(--sapin);display:grid;place-items:center"><svg width="62" height="62" viewBox="0 0 24 24"><path d="M3 11.5L21 3l-6.5 18-3-7.5z" fill="var(--lime)"/></svg></span>`);env.def.x=880;env.def.y=1180;pop(env,fin(3)+.1,.35);son(fin(3)+.2,'clic');
 for(const o of [ec,fr,env])A(o,T4-.05,.3,{o:[1,0],b:[0,12]},'in');
 A(bulle,T4-.08,.4,{y:[0,-560],s:[1,.8],o:[1,0]},'in');
}
/* =============== 4. UNE IA GRATUITE ÉCRIT LA FORMULE =============== */
const T5=deb(5)-.15;
const FORM='=SOMME.SI.ENS(C2:C5; A2:A5; "Awa"; B2:B5; "Savon")';
{const s=scene(T4,T5+.5,'radial-gradient(120% 80% at 50% 30%,#0b4a2a 0%,#03140b 75%)','rgba(255,255,255,.05)',4);
 s.cx=540;s.cy=300;s.def.cr=0;A(s,T4,.5,{cr:[0,2300]},'inOut');son(T4-.05,'whoosh2');
 const t1=mk(s,'<div class="T c" style="font-size:120px">Une IA <span style="color:var(--lime)">gratuite</span></div>');t1.def.y=290;entre(t1,w(4,1)-.05,50,.38);
 const logos=[['img/chatgpt.png','ChatGPT'],['img/googlegemini.png','Gemini'],['img/claude.png','Claude']];
 const L=logos.map(([src,n],i)=>{const o=mk(s,`<span class="pill" style="background:#fff;color:var(--encre);font-size:50px;padding:16px 34px 16px 18px"><img src="${src}" style="width:68px;height:68px;object-fit:contain">${n}</span>`);
  o.def.x=[50,395,705][i];o.def.y=440;pop(o,w(4,3)-.1+i*.13,.4,.4);son(w(4,3)-.1+i*.13,'pop',800+i*150);return o});
 const t2=mk(s,'<div class="S c" style="font-size:118px;color:var(--lime)">écrit la formule pour toi</div>');t2.def.y=600;entre(t2,w(4,5)-.06,50,.4);
 const rep=mk(s,`<div class="carte" style="width:940px;padding:40px 46px;background:#fff;color:var(--encre)">
   <div style="display:flex;align-items:center;gap:18px;font:700 38px I;color:#444;margin-bottom:26px"><img src="img/chatgpt.png" style="width:58px">Réponse de l’IA</div>
   <div class="M" style="background:#f2f6f3;border:3px solid #dbe6de;border-radius:24px;padding:30px 30px;font-size:46px;line-height:1.3;color:var(--sapin);min-height:210px;font-weight:700"><span class="tape"></span><span class="car" style="display:inline-block;width:5px;height:50px;background:var(--vif);vertical-align:-8px"></span></div>
   <div style="display:flex;justify-content:flex-end;margin-top:26px"><span class="cp pill" style="background:var(--sapin);color:#fff;font-size:42px;padding:16px 34px">Copier</span></div></div>`);
